services:
  app:
    build:
      args:
        ARG_LINUX_LOCALE: en_US.UTF-8
        ARG_USER_UID: ${ARG_USER_UID}
        ARG_USER_GID: ${ARG_USER_GID}
        ARG_RUBY_VERSION: 3.4.4
        ARG_BUNDLER_VERSION: 2.6.9
        ARG_RAILS_VERSION: 8.0.2
      context: .
      dockerfile: Dockerfile.poc
    depends_on:
      - postgres
      - redis
    working_dir: /home/user/rails_api
    environment:
      BINDING: 0.0.0.0
      PORT: 3000
      WEB_CONCURRENCY: 0
    extra_hosts:
      - dockerhost:host-gateway
    ports:
      - 3000:3000
    tty: true
    volumes:
      - app_local:/usr/local
      - ~/.ssh:/home/user/.ssh
      - ~/.gitconfig:/home/user/.gitconfig
      - ~/.bash_history:/home/user/.bash_history
      - .:/home/user/rails_api
    networks:
      - garden_network

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      PSQL_HISTFILE: /root/log/.psql_history
      POSTGRES_USER: garden_dev
      POSTGRES_PASSWORD: garden_dev
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garden_dev"]
      interval: 10s
      timeout: 2s
      retries: 10
    logging:
      driver: none
    networks:
      - garden_network

  redis:
    image: redis:6.2.6-alpine
    ports:
      - 6379:6379
    networks:
      - garden_network

volumes:
  app_local:
  postgres_data:

networks:
  garden_network:
    name: garden_network
    driver: bridge
